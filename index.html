<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DFdeTodos</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>

        <div class="logo">
            DFdeTodos
        </div>

        <nav>
            <a href="projetos.html">Projetos Sociais</a>
            <a href="osc.html">Minha OSC</a>
            <a href="sobre.html">Sobre Nós</a>
        </nav>

    </header>

    <main>

        <section class="login-container">

            <form class="login-box">

                <h2>Login</h2>

                <label for="email">E-Mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <div class="botoes">

                    <button type="submit">
                        Log In
                    </button>

                    <button type="button">
                        Cadastrar OSC
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
