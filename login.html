<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DFdeTodos</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header>
        <button class="menu-btn" onclick="document.querySelector('nav').classList.toggle('aberto')">☰</button>

        <h2 class="titulo">DFdeTodos</h2>

        <img class="logo-img" src="img/Logo DFdeTodos.png" alt="DFdeTodos">

        <nav>
            <a href="projetos.html">Projetos Sociais</a>
            <a href="perfil-pessoal-osc.html">Minha OSC</a>
            <a href="sobre.html">Sobre Nós</a>
        </nav>
    </header>

    <main>

        <section class="login-box">

            <h2>Login</h2>

            <form>

                <div class="campo">
                    <label for="email">E-Mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                    >
                </div>

                <div class="botoes">
                    <a href="home.html">
                        <button type="button">Log In</button>
                    </a>

                    <a href="cadastro.html">
                        <button type="button" class="secundario">Cadastrar OSC</button>
                    </a>
                </div>

            </form>

        </section>

    </main>

    <footer>
        <p>DFdeTodos © 2026</p>
    </footer>

</body>

</html>
