<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DFdeTodos</title>
</head>
<body>

    <header>

        <img src="img/Logo DFdeTodos.png" alt="Logo DFdeTodos">

        <h1>DFdeTodos</h1>

        <nav>
            <a href="projetos.html">Projetos Sociais</a> |
            <a href="perfil-osc.html">Minha OSC</a> |
            <a href="sobre.html">Sobre Nós</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Login</h2>

            <form>

                <div>

                    <label for="email">E-Mail:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="senha">Senha:</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                    >

                </div>

                <br>

                <button type="submit">
                    Log In
                </button>

                <a href="cadastro.html">
                    <button type="button">
                        Cadastrar OSC
                    </button>
                </a>

            </form>

        </section>

    </main>

    <footer>

    </footer>

</body>
</html>
