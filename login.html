<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DFdeTodos</title>
</head>
<body>

    <header>

        <img src="img/Logo DFdeTodos.png" alt="Logo DFdeTodos" width="40">

        <strong>DFdeTodos</strong>

        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

        <a href="projetos.html">Projetos Sociais</a> |
        <a href="perfil-pessoal-osc.html">Minha OSC</a> |
        <a href="sobre.html">Sobre Nós</a>

        <hr>

    </header>

    <main>

        <section align="center">

            <h2>Login</h2>

            <form>

                <div>

                    <label for="email">
                        E-Mail:
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>

                <br>

                <div>

                    <label for="senha">
                        Senha:
                    </label>

                    <br>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                    >

                </div>

                <br><br>

                <a href="home.html">

                    <button type="button">
                        Log In
                    </button>

                </a>

                &nbsp;&nbsp;

                <a href="cadastro.html">

                    <button type="button">
                        Cadastrar OSC
                    </button>

                </a>

            </form>

        </section>

    </main>

    <br><br><br>

    <footer>

        <hr>

        <p align="center">
            DFdeTodos © 2026
        </p>

    </footer>

</body>
</html>
