<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastramento - DFdeTodos</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <header>
        <button class="menu-btn" onclick="document.querySelector('nav').classList.toggle('aberto')">☰</button>

        <h2 class="titulo">DFdeTodos</h2>

        <img class="logo-img" src="img/Logo DFdeTodos.png" alt="DFdeTodos">

        <nav>
            <a href="projetos.html">Projetos Sociais</a>
            <a href="perfil-osc.html">Minha OSC</a>
            <a href="sobre.html">Sobre Nós</a>
        </nav>
    </header>

    <main>

        <form class="cadastro-box">

            <h2>Cadastramento</h2>

            <section>
                <h3>Dados do Responsável/Gestor</h3>

                <div class="grid">

                    <div class="campo">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome">
                    </div>

                    <div class="campo">
                        <label for="email">E-Mail:</label>
                        <input type="email" id="email">
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone/WhatsApp:</label>
                        <input type="text" id="telefone">
                    </div>

                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha">
                    </div>

                </div>
            </section>

            <section>
                <h3>Dados da OSC</h3>

                <div class="grid">

                    <div class="campo">
                        <label for="instituicao">Nome da Instituição:</label>
                        <input type="text" id="instituicao">
                    </div>

                    <div class="campo">
                        <label for="fundacao">Data Fundação:</label>
                        <input type="date" id="fundacao">
                    </div>

                    <div class="campo">
                        <label for="cnpj">CNPJ (Opcional):</label>
                        <input type="text" id="cnpj">
                    </div>

                    <div class="campo">
                        <label for="macroregiao">Macroregião do DF:</label>
                        <select id="macroregiao">
                            <option>Selecione</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="regiao">Região Administrativa:</label>
                        <select id="regiao">
                            <option>Selecione</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep">
                    </div>

                    <div class="campo">
                        <label for="endereco">Endereço Completo:</label>
                        <input type="text" id="endereco">
                    </div>

                    <div class="campo">
                        <label for="whatsapp">WhatsApp / Telefone:</label>
                        <input type="text" id="whatsapp">
                    </div>

                    <div class="campo">
                        <label for="causa">Causa Principal:</label>
                        <select id="causa">
                            <option>Selecione</option>
                        </select>
                    </div>

                </div>
            </section>

            <button type="submit">Cadastrar</button>

        </form>

    </main>

    <footer>
        <p>DFdeTodos © 2026</p>
    </footer>

</body>

</html>
