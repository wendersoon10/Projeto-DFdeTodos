<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro OSC - DFdeTodos</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>

        <div class="logo">
            DFdeTodos
        </div>

        <nav>
            <a href="projetos.html">Projetos Sociais</a>
            <a href="perfil-osc.html">Minha OSC</a>
            <a href="projetos.html">Sobre Nós</a>
        </nav>

    </header>

    <main>

        <h1>Cadastro</h1>

        <form>

            <fieldset>

                <legend>Dados do Responsável/Gestor</legend>

                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="telefone">Telefone/WhatsApp</label>
                    <input type="tel" id="telefone" name="telefone">
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

            </fieldset>

             <fieldset>

                <legend>Dados da OSC</legend>

                <div>
                    <label for="instituicao">Nome da instituição:</label>
                    <input type="text" id="instituicao" name="instituicao" required>
                </div>

                <div>
                    <label for="fundacao">Data Fundação:</label>
                    <input type="date" id="fundacao" name="fundacao">
                </div>

                <div>
                    <label for="cnpj">CNPJ (Opcional): </label>
                    <input type="text" id="cnpj" name="cnpj">
                </div>

                <div>
                    <label for="macroregiao">Macrorregião do DF:</label>
                    <select id="macroregiao" name="macroregiao">
                        <option value="">Selecione</option>
                    </select>
                </div>

                   <div>
                    <label for="regiao">Região Administrativa:</label>
                    <select id="regiao" name="regiao">
                        <option value="">Selecione</option>
                    </select>
                </div>

                  <div>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep">
                </div>

                <div>
                    <label for="endereco">Endereço Completo:</label>
                    <input type="text" id="endereco" name="endereco">
                </div>

                <div>
                    <label for="telefoneOsc">WhatsApp / Telefone:</label>
                    <input type="tel" id="telefoneOsc" name="telefoneOsc">
                </div>

                <div>
                    <label for="causa">Causa Principal:</label>
                    <select name="causa" id="causa">
                       <option value="">Selecione</option>
                       <option value="Educação"></option> 
                       <option value="Saúde"></option> 
                       <option value="Meio Ambiente"></option> 
                       <option value="Assistência Social"></option> 
                       <option value="Cultura "></option> 
                       <option value="Esporte"></option> 
                    </select>
                </div>

            </fieldset>

            <button type="submit">
                Cadastrar OSC
            </button>

        </form>
        
    </main>
    
</body>
</html>
